name: Connect-Portal veröffentlichen

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-portal-publish
  cancel-in-progress: false

env:
  PUBLISH_TARGET: portal
  EXPECTED_DOMAIN: connect.hardt-wiehl.de
  APP_MODE: production

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Öffentliches Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Privates Connect-Repository lesen
        uses: actions/checkout@v4
        with:
          repository: AndreasHardt/connect.hardt-wiehl
          token: ${{ secrets.CONNECT_CODE_TOKEN }}
          path: _private

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Portal aus den privaten Quellen bauen
        working-directory: _private
        run: APP_MODE="$APP_MODE" npm run build:portal

      - name: Portal prüfen und übernehmen
        shell: bash
        run: |
          set -euo pipefail
          source_dir="_private/published/$PUBLISH_TARGET"
          test -f "$source_dir/index.html"
          test -f "$source_dir/styles.css"
          test -f "$source_dir/build-info.json"
          test -f "$source_dir/CNAME"
          grep -qx "$EXPECTED_DOMAIN" "$source_dir/CNAME"
          grep -q '"app_target": "portal"' "$source_dir/build-info.json"
          grep -q '"app_mode": "production"' "$source_dir/build-info.json"
          ! grep -R 'data-app-mode="test"' "$source_dir"
          ! grep -R 'noindex,nofollow,noarchive' "$source_dir"

          article_count="$(find "$source_dir" -maxdepth 1 -type f -name 'fachbeitrag-*.html' | wc -l | tr -d ' ')"
          test "$article_count" -eq 12
          box_count="$(grep -R -l 'class="article-prevention"' "$source_dir"/fachbeitrag-*.html | wc -l | tr -d ' ')"
          test "$box_count" -eq 12
          row_count="$(grep -R -h 'class="article-prevention-row"' "$source_dir"/fachbeitrag-*.html | wc -l | tr -d ' ')"
          test "$row_count" -eq 60

          for base in \
            fachbeitrag-hyatt-kleine-aenderung \
            fachbeitrag-qa-dokumentation-herstellung \
            fachbeitrag-tretten-blockscheren \
            fachbeitrag-morandi-bruecke-bestandsmanagement
          do
            test -f "$source_dir/$base.html"
            test -f "$source_dir/$base-en.html"
            test -f "$source_dir/$base-fr.html"
          done

          grep -q 'ideastatica.com/de/steel/connection-design' "$source_dir/fachbeitrag-hyatt-kleine-aenderung.html"
          grep -q 'ideastatica.com/de/support-center/allgemeine-einleitung' "$source_dir/fachbeitrag-hyatt-kleine-aenderung.html"
          grep -q 'ideastatica.com/support-center/strength-analysis' "$source_dir/fachbeitrag-hyatt-kleine-aenderung.html"
          grep -q 'hreflang="en"' "$source_dir/fachbeitrag-morandi-bruecke-bestandsmanagement.html"
          grep -q 'hreflang="fr"' "$source_dir/fachbeitrag-morandi-bruecke-bestandsmanagement.html"
          grep -q '06.08.2026' "$source_dir/index.html"

          rm -rf _site
          mkdir _site
          cp -a "$source_dir/." _site/

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name _private \
            ! -name _site \
            -exec rm -rf {} +

          cp -a _site/. .
          rm -rf _private _site
          rm -f .htaccess

      - name: Änderungen veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Connect Website Automatik'
          git config user.email 'iwe@hardt-wiehl.de'
          git add -A
          if git diff --cached --quiet; then
            echo 'Keine Änderungen zu veröffentlichen.'
            exit 0
          fi
          git commit -m 'Connect-Portal aus privatem Quellstand veröffentlichen'
          git push origin main
