name: Connect-Portal veröffentlichen

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-portal-publish
  cancel-in-progress: false

env:
  PUBLISH_TARGET: portal
  EXPECTED_DOMAIN: connect.hardt-wiehl.de
  APP_MODE: test

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Öffentliches Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Privates Connect-Repository lesen
        uses: actions/checkout@v4
        with:
          repository: AndreasHardt/connect.hardt-wiehl
          token: ${{ secrets.CONNECT_CODE_TOKEN }}
          path: _private

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Portal aus den privaten Quellen bauen
        working-directory: _private
        run: APP_MODE="$APP_MODE" npm run build:portal

      - name: Portal prüfen und übernehmen
        shell: bash
        run: |
          set -euo pipefail
          source_dir="_private/published/$PUBLISH_TARGET"
          test -f "$source_dir/index.html"
          test -f "$source_dir/styles.css"
          test -f "$source_dir/build-info.json"
          test -f "$source_dir/CNAME"
          grep -qx "$EXPECTED_DOMAIN" "$source_dir/CNAME"
          grep -q '"app_target": "portal"' "$source_dir/build-info.json"
          grep -q 'TESTSYSTEM' "$source_dir/index.html"

          rm -rf _site
          mkdir _site
          cp -a "$source_dir/." _site/

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name _private \
            ! -name _site \
            -exec rm -rf {} +

          cp -a _site/. .
          rm -rf _private _site
          rm -f .htaccess

      - name: Änderungen veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Connect Website Automatik'
          git config user.email 'iwe@hardt-wiehl.de'
          git add -A
          if git diff --cached --quiet; then
            echo 'Keine Änderungen zu veröffentlichen.'
            exit 0
          fi
          git commit -m 'Connect-Portal aus privatem Quellstand veröffentlichen'
          git push origin main
