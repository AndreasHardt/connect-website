<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Kehlnahtgeometrie</title>
  <desc id="desc">CAD-artige Kehlnahtgeometrie mit Bauteilen, Öffnungswinkel, Messpunkt M und Ist-Kehlnahtdicke.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa2ae"/>
      <stop offset="1" stop-color="#657985"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#d9e5eb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g opacity=".24" stroke="#b8ced9" stroke-width="1">
    <path d="M30 55 H690 M30 105 H690 M30 155 H690 M30 205 H690 M30 255 H690 M30 305 H690"/>
    <path d="M80 25 V335 M150 25 V335 M220 25 V335 M290 25 V335 M360 25 V335 M430 25 V335 M500 25 V335 M570 25 V335 M640 25 V335"/>
  </g>

  <path d="M130 284 H604" stroke="url(#steel)" stroke-width="28" stroke-linecap="square"/>
  <path d="M292 284 L170 78" stroke="url(#steel)" stroke-width="28" stroke-linecap="square"/>

  <path d="M292 284 L205 136 Q315 178 430 284 Z" fill="#91a9b5" opacity=".28"/>
  <path d="M205 136 Q315 178 430 284" fill="none" stroke="#f5f8fa" stroke-width="4"/>
  <path d="M205 136 L430 284" fill="none" stroke="#c9d7de" stroke-width="1.8" stroke-dasharray="10 7"/>

  <line x1="292" y1="284" x2="329" y2="222" stroke="#d9e5eb" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="336" y="231" fill="#eef5f8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">aA</text>

  <line x1="292" y1="284" x2="314" y2="193" stroke="#62a0bf" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="314" cy="193" r="6" fill="#62a0bf"/>
  <text x="325" y="190" fill="#9fc6d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">M</text>

  <path d="M268 244 A50 50 0 0 1 330 248" fill="none" stroke="#d9e5eb" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="287" y="236" fill="#eef5f8" font-family="Arial,Helvetica,sans-serif" font-size="18">γ</text>

  <line x1="179" y1="122" x2="207" y2="169" stroke="#d9e5eb" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="153" y="151" fill="#eef5f8" font-family="Arial,Helvetica,sans-serif" font-size="17">z2</text>
  <line x1="304" y1="301" x2="424" y2="301" stroke="#d9e5eb" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="356" y="326" fill="#eef5f8" font-family="Arial,Helvetica,sans-serif" font-size="17">z1</text>

  <g fill="#b8cbd5" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="1.1">
    <text x="469" y="268">BAUTEIL 1</text>
    <text x="145" y="89" transform="rotate(-59 145 89)">BAUTEIL 2</text>
    <text x="468" y="82">DIN EN ISO 5817</text>
    <text x="468" y="106" fill="#eef5f8" font-size="16" font-weight="700">MESSEN · BEWERTEN · DOKUMENTIEREN</text>
  </g>
</svg>
